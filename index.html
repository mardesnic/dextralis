    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Dextralis</title>
    <meta name="description" content="Dextralis" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #fff;
        --text: #1a1a1a;
        --muted: #666;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --text: #eee;
          --muted: #999;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        text-align: center;
      }
      .logo {
        display: block;
        width: 200px;
        max-width: 100%;
        height: auto;
        margin: 0 auto 24px;
        fill: currentColor;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        color: var(--text);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      a:hover {
        color: var(--muted);
      }
      a svg {
        width: 20px;
        height: 20px;
        flex: none;
        fill: currentColor;
      }
    </style>
  </head>
